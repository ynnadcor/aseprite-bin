# CI for the bmw-g30-hud project (lives in bmw-g30-hud/ on this branch).
# - Python: navigation->HUD simulator + read-only HSFZ/DoIP/UDS reference tests
# - Swift (Linux): BMWLinkKit build + XCTest
# - iOS (macOS runner): BMWLinkKit tests incl. end-to-end HSFZ/DoIP sessions over
#   real sockets, SwiftUI app build for the iOS Simulator, and an UNSIGNED device
#   .ipa (must be signed for your iPhone before it can be installed).
# - Publish (pushes to the project branch only): the latest .ipa and a SideStore
#   source go to the rolling "bmwlink-latest" pre-release, so SideStore can update
#   the app from the phone.
# Nothing here talks to a vehicle.
name: bmw-g30-hud CI

on:
  push:
    paths:
      - "bmw-g30-hud/**"
      - "!bmw-g30-hud/**/*.md"   # docs-only commits don't need a macOS build
      - ".github/workflows/bmw-g30-hud-ci.yml"
  pull_request:
    paths:
      - "bmw-g30-hud/**"
      - "!bmw-g30-hud/**/*.md"
      - ".github/workflows/bmw-g30-hud-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bmw-g30-hud-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail, so piped commands still fail the step

jobs:
  python:
    name: Python tests + HUD storyboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        working-directory: bmw-g30-hud
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render HUD storyboards
        working-directory: bmw-g30-hud/sim
        run: |
          mkdir -p ../out
          python -m navhud.cli --scenario city --sink hud --html ../out/city_hud.html
          python -m navhud.cli --scenario highway --sink kombi --html ../out/highway_kombi.html
      - uses: actions/upload-artifact@v4
        with:
          name: hud-storyboards
          path: bmw-g30-hud/out/*.html
          if-no-files-found: error

  swift-linux:
    name: Swift package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build + test BMWLinkKit
        working-directory: bmw-g30-hud/ios-app/BMWLinkKit
        run: swift test

  ios:
    name: iOS build (macOS runner)
    # Intel Mac (macOS 26, Xcode 26.6 like macos-latest). In Nov 2026 GitHub
    # reported "capacity constraints" for Apple Silicon macOS runners and three
    # macos-latest jobs in a row were cancelled after 15 minutes without ever
    # getting a machine. Switch back to macos-latest once that's over.
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      - name: Package tests on macOS (incl. end-to-end over real sockets)
        working-directory: bmw-g30-hud/ios-app/BMWLinkKit
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: bmw-g30-hud/ios-app
        run: xcodegen generate
      - name: Build app for iOS Simulator
        working-directory: bmw-g30-hud/ios-app
        run: |
          xcodebuild -project BMWLink.xcodeproj -scheme BMWLink \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build
      # Screenshots of each screen with practice data (simulated car), so the
      # UI can be checked without an iPhone. Small JPEGs are
      # also printed to the log between BEGIN-SHOT/END-SHOT markers.
      - name: Screenshots in the iOS Simulator (practice data)
        continue-on-error: true
        working-directory: bmw-g30-hud/ios-app
        run: |
          app=build/sim/Build/Products/Debug-iphonesimulator/BMWLink.app
          dev=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = ""
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                          best = d["udid"]
          print(best)')
          if [ -z "$dev" ]; then echo "::warning::No iPhone simulator for screenshots"; exit 0; fi
          xcrun simctl boot "$dev" 2>/dev/null || true
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$app"
          mkdir -p screenshots
          shoot() {
            name=$1; shift
            xcrun simctl launch --terminate-running-process "$dev" io.github.ynnadcor.bmwlink "$@"
            sleep 9
            xcrun simctl io "$dev" screenshot "screenshots/$name.png"
            sips -Z 1000 -s format jpeg -s formatOptions 50 "screenshots/$name.png" --out "screenshots/$name.jpg" >/dev/null
            echo "=====BEGIN-SHOT $name====="
            base64 -i "screenshots/$name.jpg" | tr -d '\n'
            echo
            echo "=====END-SHOT $name====="
          }
          shoot gauges -screenshotTab gauges
          shoot idrive -screenshotTab idrive
          shoot idrive-tweak -screenshotTab idrive -screenshotTweak sport-displays
          shoot codes -screenshotTab codes
          shoot codes-modules -screenshotTab codes -screenshotAnchor modules
          shoot code-detail -screenshotTab codes -screenshotCode P0302
          shoot code-bmw -screenshotTab codes -screenshotCode 480A20
          shoot car -screenshotTab car
          shoot car-results -screenshotTab car -screenshotAnchor results
          shoot car-test2 -screenshotTab car -screenshotAnchor test2
          shoot hud -screenshotTab hud
          xcrun simctl shutdown "$dev" || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-screenshots
          path: bmw-g30-hud/ios-app/screenshots/*.png
          if-no-files-found: ignore
      - name: Build unsigned device app and package .ipa
        working-directory: bmw-g30-hud/ios-app
        run: |
          # Every build gets a higher version, so SideStore can offer it as an update.
          xcodebuild -project BMWLink.xcodeproj -scheme BMWLink \
            -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build/device \
            MARKETING_VERSION="0.2.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/BMWLink.app Payload/
          zip -qry BMWLink-unsigned.ipa Payload
          ls -la BMWLink-unsigned.ipa
      - name: Check the app bundle meets App Store Connect upload rules
        working-directory: bmw-g30-hud/ios-app
        run: |
          app=Payload/BMWLink.app
          fail() { echo "::error::$1"; exit 1; }
          test -f "$app/Assets.car" || fail "no compiled asset catalog (app icon) in the bundle"
          # On iOS actool records the icon under CFBundleIcons, not at the top level.
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" 2>/dev/null || true)
          if [ "$icon" != "AppIcon" ]; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$app/Info.plist" 2>&1 || true
            fail "CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName is '$icon', expected AppIcon"
          fi
          ls "$app"/AppIcon*.png >/dev/null 2>&1 || fail "no AppIcon PNGs generated in the bundle"
          test -f "$app/PrivacyInfo.xcprivacy" || fail "privacy manifest missing from the bundle"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          for key in ITSAppUsesNonExemptEncryption NSLocalNetworkUsageDescription UILaunchScreen; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" >/dev/null 2>&1 || fail "Info.plist lacks $key"
          done
          echo "Bundle OK: icon '$icon', $(ls "$app"/AppIcon*.png | wc -l | tr -d ' ') icon files, privacy manifest present"
      - uses: actions/upload-artifact@v4
        with:
          name: BMWLink-unsigned-ipa
          path: bmw-g30-hud/ios-app/BMWLink-unsigned.ipa
          if-no-files-found: error

  # The owner asked for every build to be downloadable without signing in, so
  # SideStore can install and update it. One rolling pre-release holds the
  # latest unsigned .ipa and the SideStore source that points to it.
  publish:
    name: Publish latest build for SideStore
    needs: ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/bmw-g30-maps-hud-eyvj50'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BMWLink-unsigned-ipa
          path: dist
      - name: Publish the .ipa and the SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: bmwlink-latest
        run: |
          cp dist/BMWLink-unsigned.ipa dist/BMWLink.ipa
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          notes="Build ${{ github.run_number }} (${GITHUB_SHA::7}): $(git log -1 --format=%s)"
          python3 bmw-g30-hud/tools/make_sidestore_source.py \
            --ipa dist/BMWLink.ipa \
            --download-url "${base}/BMWLink.ipa" \
            --icon-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/bmw-g30-hud/ios-app/BMWLinkApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" \
            --website "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/bmw-g30-hud" \
            --notes "$notes" \
            --out dist/sidestore-source.json
          {
            echo "**${notes}**"
            echo
            echo "Unsigned BMW Link app for SideStore (or another signing tool). Add this source to SideStore once and new builds show up as updates:"
            echo
            echo "${base}/sidestore-source.json"
            echo
            echo "Read-only diagnostics: it cannot write, code, clear faults or flash anything."
          } > dist/notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file dist/notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "BMW Link: latest build" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/BMWLink.ipa dist/sidestore-source.json
          echo "SideStore source: ${base}/sidestore-source.json"
