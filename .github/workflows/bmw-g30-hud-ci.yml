# CI for the bmw-g30-hud project (lives in bmw-g30-hud/ on this branch).
# - Python: navigation->HUD simulator + read-only HSFZ/DoIP/UDS reference tests
# - Swift (Linux): BMWLinkKit build + XCTest
# - iOS (macOS runner): BMWLinkKit tests incl. end-to-end HSFZ/DoIP sessions over
#   real sockets, SwiftUI app build for the iOS Simulator, and an UNSIGNED device
#   .ipa (must be signed for your iPhone before it can be installed).
# Nothing here talks to a vehicle.
name: bmw-g30-hud CI

on:
  push:
    paths:
      - "bmw-g30-hud/**"
      - "!bmw-g30-hud/**/*.md"   # docs-only commits don't need a macOS build
      - ".github/workflows/bmw-g30-hud-ci.yml"
  pull_request:
    paths:
      - "bmw-g30-hud/**"
      - "!bmw-g30-hud/**/*.md"
      - ".github/workflows/bmw-g30-hud-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bmw-g30-hud-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail, so piped commands still fail the step

jobs:
  python:
    name: Python tests + HUD storyboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        working-directory: bmw-g30-hud
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render HUD storyboards
        working-directory: bmw-g30-hud/sim
        run: |
          mkdir -p ../out
          python -m navhud.cli --scenario city --sink hud --html ../out/city_hud.html
          python -m navhud.cli --scenario highway --sink kombi --html ../out/highway_kombi.html
      - uses: actions/upload-artifact@v4
        with:
          name: hud-storyboards
          path: bmw-g30-hud/out/*.html
          if-no-files-found: error

  swift-linux:
    name: Swift package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build + test BMWLinkKit
        working-directory: bmw-g30-hud/ios-app/BMWLinkKit
        run: swift test

  ios:
    name: iOS build (macOS runner)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      - name: Package tests on macOS (incl. end-to-end over real sockets)
        working-directory: bmw-g30-hud/ios-app/BMWLinkKit
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: bmw-g30-hud/ios-app
        run: xcodegen generate
      - name: Build app for iOS Simulator
        working-directory: bmw-g30-hud/ios-app
        run: |
          xcodebuild -project BMWLink.xcodeproj -scheme BMWLink \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device app and package .ipa
        working-directory: bmw-g30-hud/ios-app
        run: |
          xcodebuild -project BMWLink.xcodeproj -scheme BMWLink \
            -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/BMWLink.app Payload/
          zip -qry BMWLink-unsigned.ipa Payload
          ls -la BMWLink-unsigned.ipa
      - name: Check the app bundle meets App Store Connect upload rules
        working-directory: bmw-g30-hud/ios-app
        run: |
          app=Payload/BMWLink.app
          fail() { echo "::error::$1"; exit 1; }
          test -f "$app/Assets.car" || fail "no compiled asset catalog (app icon) in the bundle"
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist" 2>/dev/null || true)
          [ "$icon" = "AppIcon" ] || fail "CFBundleIconName is '$icon', expected AppIcon"
          ls "$app"/AppIcon*.png >/dev/null 2>&1 || fail "no AppIcon PNGs generated in the bundle"
          test -f "$app/PrivacyInfo.xcprivacy" || fail "privacy manifest missing from the bundle"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          for key in ITSAppUsesNonExemptEncryption NSLocalNetworkUsageDescription UILaunchScreen; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" >/dev/null 2>&1 || fail "Info.plist lacks $key"
          done
          echo "Bundle OK: icon '$icon', $(ls "$app"/AppIcon*.png | wc -l | tr -d ' ') icon files, privacy manifest present"
      - uses: actions/upload-artifact@v4
        with:
          name: BMWLink-unsigned-ipa
          path: bmw-g30-hud/ios-app/BMWLink-unsigned.ipa
          if-no-files-found: error
