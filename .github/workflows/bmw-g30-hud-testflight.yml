# Signs BMW Link with your Apple Developer account and uploads it to TestFlight.
#
# Starting a build:
#  - Any change to bmw-g30-hud/ios-app/testflight-requests.md starts it, on any
#    branch. Claude adds a line there when you ask for a build; you can also
#    edit the file in GitHub's web editor.
#  - Or Actions -> "bmw-g30-hud TestFlight" -> Run workflow. GitHub only shows
#    that button once this file is also on the repository's default branch.
#
# It needs four repository secrets - see bmw-g30-hud/docs/install-on-iphone.md
# (Route B). Without them it stops at the first step and changes nothing.
#
# Signing uses Xcode "cloud signing" with an App Store Connect API key
# (-allowProvisioningUpdates + -authenticationKey*): no certificates or
# provisioning profiles are exported or stored anywhere.
#
# Status: prepared, not yet run (needs the owner's Apple account). The first run
# may need a small fix; its log shows exactly what.
name: bmw-g30-hud TestFlight

on:
  workflow_dispatch:
    inputs:
      multicast_entitlement:
        description: "Include the multicast networking entitlement (only after Apple approved it)"
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - "bmw-g30-hud/ios-app/testflight-requests.md"

permissions:
  contents: read

# One upload at a time, and never cancel one half way.
concurrency:
  group: bmw-g30-hud-testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check signing secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - see bmw-g30-hud/docs/install-on-iphone.md (Route B)"
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 should be the whole .p8 file, including the BEGIN PRIVATE KEY and END PRIVATE KEY lines"; exit 1 ;;
          esac
          # Copying on a phone can add spaces or line breaks: keep trimmed copies.
          for pair in KEY_ID:ASC_KEY_ID ISSUER_ID:ASC_ISSUER_ID TEAM_ID:APPLE_TEAM_ID; do
            name=${pair%%:*}; src=${pair#*:}
            value=$(printf '%s' "${!src}" | tr -d '[:space:]')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          team=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          if [ ${#team} -ne 10 ]; then
            echo "::error::APPLE_TEAM_ID should be 10 characters (developer.apple.com/account -> Membership details)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Run the package tests first
        working-directory: bmw-g30-hud/ios-app/BMWLinkKit
        run: swift test

      - name: Generate the Xcode project
        working-directory: bmw-g30-hud/ios-app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key to a temporary file
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          keyfile="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          # Rebuild the PEM so stray spaces or lost line breaks from copying don't matter.
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d ' \t\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$keyfile"
          chmod 600 "$keyfile"
          if ! openssl pkey -in "$keyfile" -noout 2>/dev/null; then
            echo "::warning::openssl could not read the API key. If signing fails, copy the whole .p8 file into ASC_KEY_P8 again."
          fi
          echo "KEY_FILE=$keyfile" >> "$GITHUB_ENV"

      - name: Optional multicast entitlement
        working-directory: bmw-g30-hud/ios-app
        env:
          FROM_INPUT: ${{ inputs.multicast_entitlement }}
        run: |
          want="${FROM_INPUT:-false}"
          if grep -qiE '^multicast_entitlement:[[:space:]]*yes' testflight-requests.md 2>/dev/null; then
            want=true
          fi
          if [ "$want" != "true" ]; then
            echo "Multicast entitlement not requested: automatic car search stays off."
            exit 0
          fi
          mkdir -p Support
          cat > Support/BMWLink.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.networking.multicast</key>
            <true/>
          </dict>
          </plist>
          PLIST
          echo "ENTITLEMENTS_SETTING=CODE_SIGN_ENTITLEMENTS=Support/BMWLink.entitlements" >> "$GITHUB_ENV"

      - name: Archive (signed with the API key)
        working-directory: bmw-g30-hud/ios-app
        run: |
          archive="$RUNNER_TEMP/BMWLink.xcarchive"
          common=(-project BMWLink.xcodeproj -scheme BMWLink -configuration Release
                  -destination 'generic/platform=iOS' -archivePath "$archive"
                  DEVELOPMENT_TEAM="$TEAM_ID"
                  CURRENT_PROJECT_VERSION="${{ github.run_number }}")
          if [ -n "${ENTITLEMENTS_SETTING:-}" ]; then common+=("$ENTITLEMENTS_SETTING"); fi
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_FILE"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          if xcodebuild "${common[@]}" "${auth[@]}" CODE_SIGN_STYLE=Automatic archive; then
            exit 0
          fi
          # A team with no registered iPhone can't get the development profile a
          # signed archive uses. The upload step signs for distribution anyway,
          # so retry without signing and let that step do it.
          echo "::warning::Signed archive failed (see the log above). Retrying unsigned; the upload step signs it for distribution."
          rm -rf "$archive"
          xcodebuild "${common[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/BMWLink.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_FILE" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"; then
            echo "::error::Upload failed. Usual first-run causes: the app isn't created in App Store Connect yet ('No suitable application records', install guide step 3), the API key isn't Admin ('cloud signing permission', step 4), or the bundle ID isn't registered (step 2). The log above says which."
            exit 1
          fi
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple's processing (usually 5-30 min)."

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
